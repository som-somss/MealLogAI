<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f4"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MealLog AI">
<link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css"><title>MealLog AI</title>
</head><body>
<main>
<header><div><small id="todayLabel"></small><h1>오늘 뭐 먹었지?</h1></div><button id="settingsBtn" class="icon">⚙︎</button></header>

<section class="dateNav">
<button id="prevDay" class="dateArrow">‹</button>
<button id="dateBtn" class="dateButton"><span id="selectedDateLabel"></span><small>날짜 선택</small></button>
<button id="nextDay" class="dateArrow">›</button>
</section>
<div id="calendarPanel" class="calendarPanel" hidden>
<div class="calHead"><button id="prevMonth">‹</button><b id="monthLabel"></b><button id="nextMonth">›</button></div>
<div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div id="calendarGrid" class="calendarGrid"></div>
<button id="todayBtn" class="todayBtn">오늘로 이동</button>
</div>

<section class="summary"><div class="ring"><strong id="totalCal">0</strong><span>kcal</span></div><div class="summaryText"><p>오늘 섭취량</p><b><span id="remainCal">1800</span> kcal 남음</b><div class="macros"><span class="macro carb">탄수 <b id="carbs">0</b>g</span><span class="macro protein">단백질 <b id="protein">0</b>g</span><span class="macro fat">지방 <b id="fat">0</b>g</span></div></div></section>
<div class="sectionTitle"><b>나의 식사 기록</b><span id="recordDateHint"></span></div>
<section id="meals"></section><button id="addBtn" class="add"><span>＋</span> 음식 기록</button>
</main>

<dialog id="mealDialog"><form id="mealForm">
<div class="dialogHead"><button type="button" id="cancelBtn">취소</button><b id="dialogTitle">음식 기록</b><button type="submit" id="saveTop" class="saveTop">저장</button></div>
<label class="photo"><input id="photo" type="file" accept="image/*" capture="environment"><div class="photoWrap"><img id="preview" hidden><div id="photoStamp" class="photoStamp" hidden></div></div><span id="photoText"><b>📷</b><br>오늘 먹은 음식 사진<br><small>사진 촬영 또는 앨범에서 선택</small></span></label><div class="photoActions"><label for="photo" class="photoChange">📷 사진 추가·변경</label><button type="button" id="removePhoto" class="photoRemove" hidden>사진 삭제</button></div>
<button type="button" id="analyzeBtn" class="ai" disabled>AI 음식 분석 <span>선택</span></button><p class="aiNote">사진 저장은 무료예요. AI 버튼을 누를 때만 API를 사용해요.</p><p id="status" class="status"></p>
<div class="grid"><label>식사 종류<select id="mealType"><option>아침</option><option>점심</option><option>저녁</option><option>간식</option></select></label><label>먹은 시간<input id="mealTime" type="datetime-local"></label></div>
<div class="dbHelp"><b>무료 음식 계산</b><span>음식명을 검색하고 먹은 양만 알려주세요.</span></div>
<div id="foods"></div><button type="button" id="addFood" class="secondary">＋ 음식 하나 더 추가</button>
<label>메모<textarea id="memo" rows="2" placeholder="오늘 식사는 어땠나요?"></textarea></label>
</form></dialog>

<dialog id="settingsDialog"><form><div class="dialogHead"><button type="button" id="settingsClose">닫기</button><b>설정</b><span></span></div><label>하루 목표 칼로리<input id="goalInput" type="number" min="500" max="6000" step="50"></label><p class="hint">식사 기록과 사진은 이 기기의 브라우저에 저장돼요. 사진의 날짜·시간 표시는 식사 시간과 함께 표시되며 원본 사진은 훼손하지 않아요.</p><button type="button" id="saveSettings" class="ai">저장</button></form></dialog>
<script src="/app.js"></script></body></html>
